schema: spec-driven

context: |
  Система ведения дел о банкротстве физических лиц в РФ (ФЗ № 127-ФЗ).
  Пользователи — юристы: ведут дело должника по пяти стадиям процедуры и
  генерируют пакеты документов (.docx/.xlsx) из шаблонов.

  Монорепозиторий:
    backend/  — Symfony 6.4, PHP 8.4, Doctrine ORM 3.5, MySQL 8,
                LexikJWTAuthenticationBundle, NelmioApiDoc, PhpWord, PhpSpreadsheet
    frontend/ — React 18, TypeScript 5.9 (strict), Vite 5, Tailwind 3.4,
                shadcn/ui, TanStack Query 5, Recoil, react-router-dom 6
    docker/   — nginx, php-fpm, mysql, node (docker compose, `make up`)

  Полные инструкции по коду — в CLAUDE.md, глоссарий предметной области —
  в CONTEXT.md в корне репозитория. Опирайся на них при написании артефактов.

  Ключевые факты архитектуры:
  - App\Entity\Contracts — это дело о банкротстве целиком (карточка клиента),
    а не «договор». Номер договора — лишь поле внутри неё.
  - Enum App\Entity\Enum\BankruptcyStage выполняет три роли одновременно:
    стадия жизненного цикла дела (basic_info -> pre_court ->
    judicial_procedure_initiation -> judicial_procedure -> judicial_report),
    группа сериализации Symfony (#[Groups] на каждом поле Contracts) и
    категория шаблона документа (DocumentTemplate::$category).
    Новое поле Contracts без #[Groups] не попадёт в ответ API.
  - Восемь однотипных справочников с идентичным CRUD: Court, Creditor, Bailiff,
    FinancialManager, Fns, Mchs, Rosgvardia, Gostekhnadzor. Изменение в одном
    почти всегда требует такого же в остальных.
  - Генерация документов: DocumentTemplateProcessor подставляет данные в
    плейсхолдеры {{ court.name }} и {{ ТЕКУЩАЯ_ДАТА('дд.ММ.гггг') }};
    сложные формулировки — статические методы PreCourtMethods и
    ProcedureInitiationMethods.
  - Авторизация — JWT, stateless firewall на ^/api. Иерархия ролей:
    ROLE_ADMIN -> ROLE_FINANCIAL_MANAGER -> ROLE_MANAGER -> ROLE_USER.

  Проверка качества (обязательна перед завершением работы над backend/),
  выполняется в контейнере bankruptcy-php:
    make stan   — PHPStan level 5
    make lint   — PHP CS Fixer (@Symfony + @PSR12)
    make test   — PHPUnit на отдельной SQLite-базе
  То же гоняет CI (.github/workflows/staging.yml) при push в ветку staging.

  Известный технический долг, который следует учитывать при планировании, но не
  трогать без отдельного предложения: Contracts — god-object на ~1500 строк;
  ContractorService::updateContractFields() обновляет поля через Reflection;
  валидация написана руками без Symfony Validator и Request DTO; атрибуты
  OpenAPI есть у справочников, но отсутствуют в ContractsController; во
  фронтенде нет ESLint и Prettier.

  Язык: артефакты, спецификации и задачи пишутся на русском. Идентификаторы в
  коде — на английском.

rules:
  proposal:
    - Пиши на русском, по делу, без воды.
    - Формулируй проблему в терминах работы юриста с делом, а не в терминах кода.
    - Явно указывай, каких стадий BankruptcyStage касается изменение.
    - Всегда добавляй раздел «Вне рамок» (Non-goals).
    - Если изменение затрагивает один из восьми справочников, укажи, нужно ли
      повторить его в остальных.

  specs:
    - Пиши на русском, используй терминологию из CONTEXT.md.
    - Описывай наблюдаемое поведение API и интерфейса, а не детали реализации.
    - Для новых полей Contracts указывай стадию (группу сериализации) и
      вкладку ClientCard, где поле отображается.
    - Для изменений в генерации документов приводи конкретный синтаксис
      плейсхолдера и ожидаемый текст в документе.
    - "Учитывай роли: указывай, кому доступна возможность."

  design:
    - Пиши на русском. Создавай только когда есть неочевидный выбор между
      вариантами; для прямолинейных изменений design не нужен.
    - "Соблюдай существующие границы слоёв: тонкие контроллеры, бизнес-логика
      в src/Service, доступ к данным в src/Repository."
    - Зависимости — только автовнедрение через конструктор, обращение к
      контейнеру запрещено.
    - Указывай, нужна ли миграция Doctrine и обратно ли она совместима.
    - Указывай влияние на CacheService, если затронуты справочники.

  tasks:
    - Пиши на русском, задачи в императиве, каждая — проверяемый результат.
    - Дроби на блоки не более чем на 2 часа работы.
    - Разделяй задачи backend и frontend, указывай затрагиваемые файлы.
    - Если нужна миграция Doctrine — выноси её отдельной задачей.
    - Последней задачей всегда ставь прогон make stan, make lint и make test в
      контейнере bankruptcy-php с исправлением ошибок.

operations:
  apply:
    guidance:
      - "НЕ ОСТАВЛЯЙ КОММЕНТАРИЕВ В КОДЕ. Никаких поясняющих // и /* */,
        никаких PHPDoc-блоков с описанием того, что делает метод, никакого
        закомментированного кода, никаких TODO и FIXME. Код должен быть
        самодокументируемым за счёт имён и типов. Единственное исключение —
        PHPDoc, несущий типовую информацию, невыразимую в сигнатуре:
        @return array<int, string>, @return Collection<int, Contracts>,
        @param array{id: int, name: string}. То же правило действует во
        фронтенде; JSDoc не используем, типы описываются в TypeScript."
      - Backend - PSR-12 и .php-cs-fixer.dist.php, declare(strict_types=1) в
        каждом файле, пустая строка перед return, именованные аргументы при
        вызовах, типы у всех аргументов и возвращаемых значений, константы
        классов вместо магических строк и чисел, readonly class для сервисов
        без состояния.
      - Frontend - импорты через алиасы @/, @components/, @ui/ и т. д.;
        все запросы к API через apiRequest() из src/config/api.js, голый fetch
        не использовать; асинхронные данные через TanStack Query; модалки через
        реестр ModalProvider; UI-примитивы из src/components/ui (shadcn/ui);
        тексты интерфейса на русском.
      - "Добавляя поле в Contracts, обязательно проставь атрибут #[Groups] с
        нужной стадией BankruptcyStage и добавь поле в соответствующую вкладку
        ClientCard, иначе оно не дойдёт до интерфейса."
      - Перед завершением задачи, затронувшей backend/, выполни в контейнере
        bankruptcy-php команды make stan, make lint, make test и исправь все
        ошибки. Не считай задачу выполненной, пока они не проходят.
      - Новую логику контроллеров и сервисов покрывай функциональным тестом по
        образцу tests/Controller/ContractsControllerTest.php.

  archive:
    guidance:
      - Кратко подведи итог на русском - что изменилось в поведении системы.
      - Отдельно отметь применённые миграции Doctrine и изменения контракта API.
