# Хостовый nginx для bankrot.shefcode.tech.
# Положить на сервере как /etc/nginx/sites-available/bankrot.shefcode.tech.conf
# и включить симлинком в sites-enabled.
#
# Блоки SSL и редирект с http добавит certbot при выпуске сертификата,
# поэтому изначально здесь только http на 80 порту.

server {
    listen 80;
    listen [::]:80;
    server_name bankrot.shefcode.tech;

    # Загрузка шаблонов документов .docx и .xlsx. Совпадает с лимитами
    # контейнерного nginx и php (post_max_size, upload_max_filesize).
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Без этого заголовка Symfony считает запрос незащищённым и строит
        # абсолютные ссылки по http.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Генерация пакета документов по делу занимает заметно больше
        # стандартных 60 секунд.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    access_log /var/log/nginx/bankrot_access.log;
    error_log  /var/log/nginx/bankrot_error.log;
}
