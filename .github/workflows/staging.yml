name: Деплой на Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '20.19.5'

jobs:
  changes:
    name: Определение изменений
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Получение кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Определение базового коммита
        id: base
        run: |
          if [ -n "${{ github.event.before }}" ]; then
            echo "ref=${{ github.event.before }}" >> $GITHUB_OUTPUT
          else
            echo "ref=HEAD~1" >> $GITHUB_OUTPUT
          fi

      - name: Проверка изменений
        uses: dorny/paths-filter@v2
        id: filter
        with:
          base: ${{ steps.base.outputs.ref }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  phpstan:
    name: PHPStan
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Настройка PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, xml, ctype, iconv, intl
          coverage: none

      - name: Получение кэша Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Установка зависимостей Composer
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Проверка кода PHPStan
        working-directory: backend
        run: make stan

  lint:
    name: PHP CS Fixer
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Настройка PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, xml, ctype, iconv, intl
          coverage: none

      - name: Получение кэша Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Установка зависимостей Composer
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Проверка стиля кода
        working-directory: backend
        run: make lint

  test:
    name: PHPUnit Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Настройка PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, xml, ctype, iconv, intl
          coverage: none

      - name: Получение кэша Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Установка зависимостей Composer
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Создание .env файла для тестов
        working-directory: backend
        run: |
          mkdir -p var
          echo "APP_ENV=test" > .env.local
          echo "APP_SECRET=test_secret_key_for_ci_cd" >> .env.local
          echo "DATABASE_URL=sqlite:///$(pwd)/var/test.db" >> .env.local

      - name: Генерация JWT ключей
        working-directory: backend
        env:
          APP_ENV: test
        run: make jwt-gen

      - name: Запуск тестов
        working-directory: backend
        env:
          APP_ENV: test
        run: make test

  type-check:
    name: TypeScript Type Check
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей npm
        working-directory: frontend
        run: npm ci

      - name: Проверка типов TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

  deploy:
    name: Деплой на bankrot.shefcode.tech
    needs: [changes, phpstan, lint, test, type-check]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Сборка и запуск на сервере
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STG_SSH_HOST }}
          username: ${{ secrets.STG_SSH_USER }}
          key: ${{ secrets.STG_SSH_KEY }}
          port: ${{ secrets.STG_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.STG_PROJECT_DIR }}

            git fetch --prune origin staging
            git reset --hard origin/staging

            docker compose -f compose.prod.yml build
            docker compose -f compose.prod.yml up -d

            docker compose -f compose.prod.yml exec -T -u www-data php make db-migrate
            docker compose -f compose.prod.yml exec -T -u www-data php make cc

            HTTP_PORT=$(grep -E '^HTTP_PORT=' .env | cut -d= -f2)
            curl -fsS --retry 10 --retry-delay 3 "http://127.0.0.1:${HTTP_PORT:-8094}/api/v1/health"
