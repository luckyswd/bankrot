name: Деплой на Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '20.19.5'

jobs:
  changes:
    name: Определение изменений
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Получение кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Определение базового коммита
        id: base
        run: |
          if [ -n "${{ github.event.before }}" ]; then
            echo "ref=${{ github.event.before }}" >> $GITHUB_OUTPUT
          else
            echo "ref=HEAD~1" >> $GITHUB_OUTPUT
          fi

      - name: Проверка изменений
        uses: dorny/paths-filter@v2
        id: filter
        with:
          base: ${{ steps.base.outputs.ref }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  phpstan:
    name: PHPStan
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Настройка PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, xml, ctype, iconv, intl
          coverage: none

      - name: Получение кэша Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Установка зависимостей Composer
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Проверка кода PHPStan
        working-directory: backend
        run: make stan

  lint:
    name: PHP CS Fixer
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Настройка PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, xml, ctype, iconv, intl
          coverage: none

      - name: Получение кэша Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Установка зависимостей Composer
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Проверка стиля кода
        working-directory: backend
        run: make lint

  test:
    name: PHPUnit Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Настройка PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, xml, ctype, iconv, intl
          coverage: none

      - name: Получение кэша Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Установка зависимостей Composer
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Создание .env файла для тестов
        working-directory: backend
        run: |
          mkdir -p var
          echo "APP_ENV=test" > .env.local
          echo "APP_SECRET=test_secret_key_for_ci_cd" >> .env.local
          echo "DATABASE_URL=sqlite:///$(pwd)/var/test.db" >> .env.local

      - name: Генерация JWT ключей
        working-directory: backend
        env:
          APP_ENV: test
        run: make jwt-gen

      - name: Запуск тестов
        working-directory: backend
        env:
          APP_ENV: test
        run: make test

  type-check:
    name: TypeScript Type Check
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей npm
        working-directory: frontend
        run: npm ci

      - name: Проверка типов TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

  deploy:
    name: Деплой на bankrot.shefcode.tech
    needs: [changes, phpstan, lint, test, type-check]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      DEST: /srv/sites/bankrot.shefcode.tech
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка sshpass и rsync
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

      - name: Копирование репозитория на сервер
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          sshpass -e rsync -az --delete \
            -e "ssh -p $PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.idea' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude 'vendor' \
            --exclude 'backend/var' \
            --exclude 'docker/mysql' \
            --exclude '.env.prod' \
            --exclude '.env.local' \
            --exclude '.env.*.local' \
            ./ "$SSH_USER@$SSH_HOST:$DEST/"

      - name: Сборка и запуск боевого стека
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          PORT="${SSH_PORT:-22}"
          sshpass -e ssh -p "$PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" \
            "DEST='$DEST' DOCKERHUB_USER='$DOCKERHUB_USER' DOCKERHUB_TOKEN='$DOCKERHUB_TOKEN' bash -s" <<'REMOTE'
          set -eu
          cd "$DEST"

          COMPOSE="docker compose --env-file .env.prod -f docker-compose.prod.yml"

          # Аутентифицированные пуллы Docker Hub считаются по аккаунту, а не по
          # анонимному IP — это снимает 429 при сборке базовых образов.
          if [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "${DOCKERHUB_USER:-luckyswd}" --password-stdin
          fi

          $COMPOSE up -d --build --remove-orphans

          # У каждого «docker compose exec» ниже stdin закрыт. Это не
          # перестраховка: скрипт приезжает на сервер через «ssh bash -s», то
          # есть по stdin, а exec его же stdin и читает. Первый же exec дочитал
          # бы остаток скрипта, bash упёрся бы в EOF и вышел кодом 0 — выкат
          # зелёный, а миграции и сброс кэша не выполнены.
          #
          # От имени www-data: под root консоль оставила бы в томе app_var файлы
          # кэша, которые php-fpm потом не сможет перезаписать.
          $COMPOSE exec -T -u www-data php make db-migrate < /dev/null
          $COMPOSE exec -T -u www-data php make cc < /dev/null

          # Единственная проверка, что выкат состоялся: контейнеры могут быть
          # подняты, а приложение при этом не отвечать.
          HTTP_PORT="$(grep -E '^HTTP_PORT=' .env.prod | cut -d= -f2)"
          curl -fsS --retry 10 --retry-delay 3 "http://127.0.0.1:${HTTP_PORT:-8094}/api/v1/health"

          # Оба сайта живут на одном сервере и выкатываются одним движением.
          # Параллельная уборка образов отвечает «a prune operation is already
          # running» — это столкновение соседей, а не поломка выката.
          docker image prune -f || echo "уборка образов пропущена: занята соседним выкатом"
          REMOTE
