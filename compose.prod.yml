name: bankrot-prod

services:
    nginx:
        build:
            context: .
            dockerfile: docker/frontend/Dockerfile.prod
        image: bankrot-web
        container_name: bankrot-nginx
        restart: unless-stopped
        ports:
            - "127.0.0.1:${HTTP_PORT:-8094}:80"
        depends_on:
            - php
        networks:
            - bankrot

    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile.prod
        image: bankrot-app
        container_name: bankrot-php
        restart: unless-stopped
        environment:
            APP_ENV: prod
            APP_DEBUG: "0"
            APP_SECRET: ${APP_SECRET:?APP_SECRET не задан в .env}
            DATABASE_URL: "mysql://${MYSQL_USER:-bankruptcy}:${MYSQL_PASSWORD:?MYSQL_PASSWORD не задан в .env}@mysql:3306/${MYSQL_DATABASE:-bankruptcy}?serverVersion=8.0&charset=utf8mb4"
            JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
            JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
            JWT_PASSPHRASE: ${JWT_PASSPHRASE:?JWT_PASSPHRASE не задан в .env}
            CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-https://bankrot.shefcode.tech}
            TRUSTED_PROXIES: ${TRUSTED_PROXIES:-REMOTE_ADDR}
        volumes:
            - bankrot-var:/var/www/html/var
            - bankrot-jwt:/var/www/html/config/jwt
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - bankrot

    mysql:
        image: mysql:8.0
        container_name: bankrot-mysql
        restart: unless-stopped
        command: --max_allowed_packet=16M
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD не задан в .env}
            MYSQL_DATABASE: ${MYSQL_DATABASE:-bankruptcy}
            MYSQL_USER: ${MYSQL_USER:-bankruptcy}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD не задан в .env}
        volumes:
            - bankrot-db:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s
        networks:
            - bankrot

volumes:
    bankrot-db:
    bankrot-var:
    bankrot-jwt:

networks:
    bankrot:
        driver: bridge
